<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; min-height: 100vh; padding: 48px 16px;
    background: linear-gradient(135deg, #6366f1, #a855f7 60%, #ec4899);
    color: #1f2937;
  }
  .card {
    max-width: 440px; margin: 0 auto; background: #fff;
    border-radius: 16px; padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
  }
  h1 { margin: 0 0 4px; font-size: 28px; color: #4f46e5; }
  .count { margin: 0 0 20px; color: #6b7280; font-size: 14px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border: 2px solid #e5e7eb; border-radius: 10px;
    font-size: 15px; outline: none; transition: border-color .15s;
  }
  input[type=text]:focus { border-color: #6366f1; }
  form button {
    padding: 0 20px; border: none; border-radius: 10px; cursor: pointer;
    background: #6366f1; color: #fff; font-size: 15px; font-weight: 600;
    transition: background .15s;
  }
  form button:hover { background: #4f46e5; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    margin-bottom: 8px; background: #f5f3ff; border-radius: 10px;
    border-left: 4px solid #a855f7; transition: opacity .15s;
  }
  li span { flex: 1; word-break: break-word; }
  li.done { border-left-color: #10b981; background: #ecfdf5; }
  li.done span { text-decoration: line-through; color: #9ca3af; }
  li input[type=checkbox] { width: 18px; height: 18px; accent-color: #10b981; cursor: pointer; }
  li button {
    border: none; background: none; cursor: pointer; font-size: 16px;
    color: #9ca3af; border-radius: 6px; padding: 2px 6px;
  }
  li button:hover { color: #ef4444; background: #fee2e2; }
  .empty { text-align: center; color: #9ca3af; padding: 16px 0; }
  .pop {
    position: fixed; font-size: 32px; pointer-events: none;
    animation: float 1s ease-out forwards;
  }
  @keyframes float {
    from { opacity: 1; transform: translateY(0) scale(.8); }
    to { opacity: 0; transform: translateY(-80px) scale(1.4); }
  }
</style>
</head>
<body>
<div class="card">
  <h1>My Tasks</h1>
  <p class="count" id="count"></p>
  <form id="f"><input type="text" id="t" placeholder="Add a new task..." required><button>Add</button></form>
  <ul id="list"></ul>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
const list = document.getElementById('list');
const ADD = ['✨', '📝', '🚀', '💡', '🌟'];
const DONE = ['🎉', '✅', '🥳', '👏', '🔥'];
function pop(list, x, y) {
  const el = document.createElement('div');
  el.className = 'pop';
  el.textContent = list[Math.floor(Math.random() * list.length)];
  el.style.left = (x - 16) + 'px';
  el.style.top = (y - 16) + 'px';
  document.body.append(el);
  setTimeout(() => el.remove(), 1000);
}
function save() { localStorage.setItem('tasks', JSON.stringify(tasks)); render(); }
function render() {
  list.innerHTML = '';
  const left = tasks.filter(t => !t.done).length;
  document.getElementById('count').textContent = tasks.length ? `${left} of ${tasks.length} remaining` : '';
  if (!tasks.length) {
    list.innerHTML = '<li class="empty" style="display:block;background:none;border:none">Nothing to do yet 🎉</li>';
    return;
  }
  tasks.forEach((t, i) => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.done;
    cb.onchange = () => {
      t.done = cb.checked;
      if (t.done) { const r = cb.getBoundingClientRect(); pop(DONE, r.left, r.top); }
      save();
    };
    const s = document.createElement('span'); s.textContent = t.text;
    const x = document.createElement('button'); x.textContent = '✕';
    x.onclick = () => { tasks.splice(i, 1); save(); };
    li.append(cb, s, x);
    list.append(li);
  });
}
document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const inp = document.getElementById('t');
  tasks.push({ text: inp.value.trim(), done: false });
  inp.value = '';
  const r = e.submitter.getBoundingClientRect();
  pop(ADD, r.left + r.width / 2, r.top);
  save();
};
render();
</script>
</body>
</html>
